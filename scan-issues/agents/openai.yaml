interface:
  display_name: "Scan Issues"
  short_description: "扫描 todo issues：并行默认最多 5 个，串行默认全部处理"
  default_prompt: "Use $scan-issues to develop eligible todo issues. Develop in parallel by default with a limit of 5; include deps, 依赖, 串行, 逐个, one, or slow to discover dependencies and run all eligible issues one at a time by default. Use an explicit limit such as size=5, length=10, or 最多做 10 个 to cap either mode."
